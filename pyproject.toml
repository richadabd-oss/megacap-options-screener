[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megacap-options-screener"
version = "0.1.0"
description = "Pulls financial data and options chains for mega-cap US and European stocks, filters for P/E > 0, and calculates annualized Cash-Secured Put and Covered Call yields."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.scripts]
options-screener = "screener.cli:main"
